<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>APPraforgó — megosztási kártya (koncepció)</title>
<!--
  Az oldal megosztási kártyája, 1200 × 630 — az élő oldalé és a koncepcióé
  is. Nem látogatóknak készült: a design/og-image.js nyitja meg, lefényképezi,
  és az assets/og.jpg / og-en.jpg fájlba írja. A nyelvet a ?lang=en dönti el.

  Egy képben az egész nap: balra hűvös hajnali papír, jobbra mézszínű
  délután, és a nap a jobb felső sarokban — a virág felé néz. A virágot
  ugyanaz a koncepcio.js rajzolja, mint az oldalon, ugyanazzal a
  determinisztikus véletlennel: bitre ugyanaz a virág.
-->
<style>
@font-face { font-family: "Newsreader Display"; src: url("fonts/newsreader-display.woff2") format("woff2"); font-weight: 330; }
@font-face { font-family: "Newsreader Display"; src: url("fonts/newsreader-display-italic.woff2") format("woff2"); font-weight: 330; font-style: italic; }
@font-face { font-family: "Newsreader Text"; src: url("fonts/newsreader-text.woff2") format("woff2"); font-weight: 400 560; }
@font-face { font-family: "Fragment Mono"; src: url("fonts/fragment-mono-hu.woff2") format("woff2"); font-weight: 400; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }

body {
  position: relative;
  color: #1C1915;
  background:
    /* a nap: jobbra fent, a virág mögött */
    radial-gradient(620px 520px at 88% 4%, rgba(255, 219, 148, .62) 0%, rgba(255, 219, 148, .22) 42%, transparent 72%),
    /* a nap íve egy képben: hajnali gyöngyház balra, aranyóra jobbra */
    linear-gradient(100deg, #EFEFEA 0%, #F4EEDF 46%, #F4E3C4 100%);
  -webkit-font-smoothing: antialiased;
}

/* A virág: jobbra, a kép szélén levágva, enyhén a nap felé fordítva. */
.stage {
  position: absolute; width: 760px; height: 760px; left: 712px; top: -58px;
  perspective: 1600px;
}
.stage .shadow {
  position: absolute; inset: 10% 6% 2% 14%;
  background: radial-gradient(closest-side, rgba(43, 58, 85, .22), rgba(43, 58, 85, .08) 55%, transparent 80%);
  translate: -6% 8%; filter: blur(16px);
}
.flower { width: 100%; height: 100%; overflow: visible; transform: rotateY(10deg) rotateX(5deg); }

/* Hideg vignetta a sarkokban — meleg fény, hideg árnyék. */
.lens {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 120% at 40% 45%, transparent 58%, rgba(43, 58, 85, .11) 100%);
  mix-blend-mode: multiply;
}

.copy { position: absolute; left: 72px; top: 60px; bottom: 56px; width: 700px; display: flex; flex-direction: column; }

.mark { display: flex; align-items: center; gap: 14px; font: 560 30px/1 "Newsreader Text", Georgia, serif; letter-spacing: -.01em; }
.mark img { width: 44px; height: 44px; }

.title {
  margin-top: 64px;
  font: 330 124px/.88 "Newsreader Display", Georgia, serif;
  letter-spacing: -.045em;
}
.title span { display: block; }
.title em { display: block; padding-left: .55em; font-style: italic; color: #744600; letter-spacing: -.04em; }

.desc { margin-top: 34px; max-width: 30ch; font: 400 29px/1.32 "Newsreader Text", Georgia, serif; color: #585046; }

.foot {
  margin-top: auto; padding-top: 18px; width: 560px;
  border-top: 1px solid rgba(28, 25, 21, .18);
  display: flex; justify-content: space-between; align-items: baseline;
  font: 400 19px/1 "Fragment Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase;
}
.foot .rule { color: #744600; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <div class="shadow"></div>
    <svg class="flower" viewBox="-560 -560 1120 1120"></svg>
  </div>
  <div class="lens"></div>

  <div class="copy">
    <p class="mark"><img src="../../assets/logo.svg" alt=""><span>APPraforgó</span></p>
    <h1 class="title"><span data-t="l1">Ötletből</span><em data-t="l2">alkalmazások</em></h1>
    <p class="desc" data-t="desc">Egyedi webes alkalmazások kis- és középvállalatoknak</p>
    <p class="foot"><span>appraforgo.hu</span><span class="rule" data-t="rule">137,5°</span></p>
  </div>

<script>
  // Nyelvenként csak a szöveg változik, a kompozíció nem.
  (function () {
    var T = {
      en: { l1: "Ideas into", l2: "applications", desc: "Custom web applications for small and medium-sized businesses", rule: "137.5°" }
    };
    var lang = new URLSearchParams(location.search).get("lang");
    if (!T[lang]) return;
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = T[lang][el.dataset.t]; });
  })();
</script>
<script src="koncepcio.js"></script>
</body>
</html>
